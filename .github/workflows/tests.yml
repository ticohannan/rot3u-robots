# Runs on every push and pull request: the full test suite (host simulations, Python tools,
# avr-gcc builds) and an Arduino IDE-equivalent compile of both sketches with arduino-cli.
name: tests
on: [push, pull_request]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and the AVR toolchain
        run: |
          pip install numpy
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr
      - name: Fetch ArduinoCore-avr 1.8.8 and Servo 1.2.2 (for the avr-gcc build tests)
        run: |
          git clone --depth 1 --branch 1.8.8 https://github.com/arduino/ArduinoCore-avr.git ../ext/ArduinoCore-avr
          git clone --depth 1 --branch 1.2.2 https://github.com/arduino-libraries/Servo.git ../ext/Servo
      - name: Run the tests
        run: python tests/run_tests.py

  arduino-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:mega
          libraries: |
            - name: Servo
          sketch-paths: |
            - firmware/servo_tester
            - firmware/ik_demo
